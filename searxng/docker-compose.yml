# A private SearXNG for AgentGuard (optional). AgentGuard asks it two kinds of question, and nothing else:
#   - a website's own name ("does the site show up when someone searches for it?")
#   - the target role a person typed ("what do hiring pages for it ask for?")
#
# Put a long random SEARXNG_SECRET (and SEARXNG_URL=http://127.0.0.1:8888) in your .env, then from the project folder:
#
#   docker compose --env-file ../.env -f searxng/docker-compose.yml up -d        # adjust the path to your .env
#
# or set the variable in the shell:  export SEARXNG_SECRET="$(openssl rand -hex 32)"
#
# Run on 2026-11-22 (Docker Desktop, Windows): the container started, JSON search returned results, and AgentGuard's
# client read them (a website's name and a job role). SearXNG forwards each query to public search engines, so what AgentGuard
# sends (a site's name or a role) leaves your machine through it. That is the reason it is optional.
services:
  searxng:
    # Pinned to the digest that was pulled and tested on 2026-11-22, so that updates are your decision.
    # To update: `docker pull searxng/searxng:latest`, test it, then replace the digest below.
    image: docker.io/searxng/searxng:latest@sha256:dc2f7ed8a215b2f8244eaed083acdd50406f0de18bf43410cc460a4b511b7424
    restart: unless-stopped
    ports:
      # loopback only: the search server is for AgentGuard on this machine, not for the network
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET to a long random value}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
    security_opt:
      - no-new-privileges:true
